name: Build and Release Windows App

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: step-down-pro-v__VERSION__
          releaseName: "Step Down Pro v__VERSION__"
          releaseBody: "PapaDOMO Pixel Art Converter — free ALLIANCE desktop app. Download the .msi or .exe below, run it, done."
          releaseDraft: false
          prerelease: false
